# Render Blueprint for the room server.
#
# ⚠ Deploy this with **New + → Blueprint**, NOT "New + → Web Service".
#    Render only reads this file in the Blueprint flow. Create it as a Web
#    Service and Render ignores everything here, sniffs the root package.json,
#    runs `npm install; npm run build` — which is `next build`, the app, not
#    this server — and fails on a missing DATABASE_URL.
#
# dockerContext is the load-bearing field: it has to be the repo root, not
# server/, because server/Dockerfile COPYs src/lib across that boundary (the
# `@/*` -> `../src/*` mapping in server/tsconfig.json needs it on disk, and
# Docker cannot COPY from outside its build context).
services:
  - type: web
    name: blockworld-rooms
    runtime: docker
    dockerfilePath: ./server/Dockerfile
    dockerContext: .
    plan: free
    # The server answers GET / with a 200, so this doubles as the URL to point
    # a free uptime monitor at — the free plan sleeps after 15 minutes idle.
    healthCheckPath: /
    envVars:
      - key: PORT
        value: 8080
      # Set in the Blueprint wizard. `sync: false` means "not stored in git,
      # ask the person deploying" rather than "optional" — the server refuses
      # every join without CLERK_SECRET_KEY, and silently saves nothing
      # without MULTIPLAYER_SECRET.
      #
      # APP_URL must be the deployed Next app (https://…vercel.app), and that
      # app needs the SAME MULTIPLAYER_SECRET set on it, or this server gets a
      # 404 from /api/worlds/:id/sync and no world will ever load.
      - key: APP_URL
        sync: false
      - key: CLERK_SECRET_KEY
        sync: false
      - key: MULTIPLAYER_SECRET
        sync: false
