# CHANGE `app` before deploying — Fly app names are globally unique, so
# whatever is here is almost certainly already taken. Create the app first
# with `fly apps create <your-name>`, then put that same name here.
app = "blockworld-rooms"
primary_region = "iad"   # pick the region closest to your players: `fly platform regions`

[build]
  dockerfile = "server/Dockerfile"

[env]
  PORT = "8080"

[http_service]
  internal_port = 8080
  force_https = true
  # A room holds live WorldSession state and connected sockets in memory.
  # Scaling to zero or auto-stopping it is how you drop everyone's session
  # mid-build — this must stay resident, not scale like a stateless web app.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "256mb"
